<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Rewards | Loyalty Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900">
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <h1 class="font-bold text-xl text-indigo-600">🎖️ LoyaltyPortal</h1>
        <div id="wallet-pill" class="bg-slate-100 px-4 py-2 rounded-full text-xs font-mono font-semibold">
            7xKX...1234
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-3xl p-8 text-white shadow-xl mb-8">
            <div class="flex justify-between items-start mb-10">
                <div>
                    <p class="text-indigo-100 text-sm uppercase tracking-wider font-semibold">Current Tier</p>
                    <h2 class="text-4xl font-black mt-1">GOLD MEMBER</h2>
                </div>
                <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-md">
                    <span class="text-3xl">🏆</span>
                </div>
            </div>
            
            <div class="space-y-2">
                <div class="flex justify-between text-sm font-medium">
                    <span>12,450 / 15,000 PTS</span>
                    <span>83% to Platinum</span>
                </div>
                <div class="w-full bg-white/20 rounded-full h-3 overflow-hidden">
                    <div class="bg-white h-full transition-all duration-1000" style="width: 83%"></div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold">Recent Activity</h3>
                <a href="#" class="text-xs text-indigo-600 font-bold hover:underline">View All</a>
            </div>
            <div class="divide-y divide-slate-100">
                <div class="px-6 py-4 flex justify-between items-center hover:bg-slate-50">
                    <div>
                        <p class="font-semibold text-sm">Purchase Bonus</p>
                        <p class="text-xs text-slate-500">Order #ORD-9928 • 2h ago</p>
                    </div>
                    <span class="text-emerald-600 font-bold">+450</span>
                </div>
                <div class="px-6 py-4 flex justify-between items-center hover:bg-slate-50">
                    <div>
                        <p class="font-semibold text-sm">Referral Reward</p>
                        <p class="text-xs text-slate-500">User @cryptoknight • 1d ago</p>
                    </div>
                    <span class="text-emerald-600 font-bold">+1,200</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
